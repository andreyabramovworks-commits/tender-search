[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-search"
version = "0.1.0"
description = "Deterministic TenderLand monitoring with PostgreSQL and Google Sheets"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3", "beautifulsoup4>=4.13,<5",
  "SQLAlchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
  "google-auth>=2.40,<3", "python-dotenv>=1.1,<2", "playwright>=1.58,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
tender-search = "tender_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

